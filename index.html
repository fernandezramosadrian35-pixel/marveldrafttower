<!DOCTYPE html>
<!--
=====================  CONFIGURACIÓN DE SUPABASE (ejecutar una vez en el SQL Editor)  =====================
create table public.players(
  id uuid primary key references auth.users(id) on delete cascade,
  username text, data jsonb, score int default 0, tower_done int default 0, updated_at timestamptz default now());
alter table public.players enable row level security;
create policy "own_select" on public.players for select using (auth.uid()=id);
create policy "own_insert" on public.players for insert with check (auth.uid()=id);
create policy "own_update" on public.players for update using (auth.uid()=id);
create policy "own_delete" on public.players for delete using (auth.uid()=id);
create view public.ranking as select username,score,tower_done from public.players order by score desc limit 100;
grant select on public.ranking to anon, authenticated;
==========================================================================================================
-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MCU Gacha Arena</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{--bg:#070b16}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#1b2447 0,#070b16 60%);color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none}
#app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
#view{flex:1;overflow-y:auto;padding:12px 12px 90px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0b1226f2;border-top:1px solid #1e293b;display:flex;max-width:900px;margin:0 auto}
nav button{flex:1;padding:8px 2px 10px;font-size:10px;font-weight:800;color:#64748b;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}
nav button span{font-size:20px}
nav button.on{color:#facc15;text-shadow:0 0 10px #facc1566}
nav button{position:relative}
nav button.gift{color:#fde047;text-shadow:0 0 10px #facc15}
nav button.gift span{display:inline-block;animation:giftpulse 1.1s ease-in-out infinite}
nav button.gift::after{content:"";position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px 2px #ef4444;animation:giftdot 1.1s ease-in-out infinite}
@keyframes giftpulse{0%,100%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 3px #facc15)}50%{transform:scale(1.28) rotate(-8deg);filter:drop-shadow(0 0 12px #facc15) drop-shadow(0 0 22px #f59e0b)}}
@keyframes giftdot{50%{transform:scale(1.35);opacity:.65}}
.panel{background:linear-gradient(160deg,#111a33,#0a1022);border:1px solid #1e293b;border-radius:14px;padding:12px}
.btn{background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;font-weight:900;border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 4px 0 #1e3a8a;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e3a8a}
.btn.gold{background:linear-gradient(180deg,#facc15,#ca8a04);color:#1c1400;box-shadow:0 4px 0 #854d0e}
.btn.red{background:linear-gradient(180deg,#ef4444,#b91c1c);box-shadow:0 4px 0 #7f1d1d}
.btn.gray{background:#334155;box-shadow:0 4px 0 #1e293b}
.btn:disabled{opacity:.4;filter:grayscale(.6)}
.sub{flex:1;padding:8px;border-radius:10px;background:#111a33;font-weight:800;font-size:12px;color:#94a3b8;border:1px solid #1e293b}
.sub.on{background:#1d4ed8;color:#fff}
.chip{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;background:#111a33;border:1px solid #1e293b;color:#94a3b8}
.chip.on{background:#facc15;color:#000}
.card{--c:#3b82f6;position:relative;border:2px solid var(--c);border-radius:14px;background:linear-gradient(160deg,#131d3b,#0a1022);box-shadow:0 0 12px -2px var(--c),inset 0 0 18px -8px var(--c);overflow:hidden;cursor:pointer}
.card.S::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s infinite;pointer-events:none}
@keyframes shine{to{transform:translateX(100%)}}
.upg .card::before{content:"";position:absolute;inset:0;z-index:5;background:linear-gradient(0deg,transparent 30%,rgba(74,222,128,.42) 50%,transparent 70%);transform:translateY(100%);animation:shineup 2.4s infinite;pointer-events:none}
.upg .card{box-shadow:0 0 14px -1px #22c55e,inset 0 0 18px -8px #22c55e}
@keyframes shineup{to{transform:translateY(-100%)}}
.card.locked{filter:grayscale(1) brightness(.4)}
.card .tb{position:absolute;top:4px;left:4px;font-size:10px;font-weight:900;color:#000;padding:0 6px;border-radius:6px}
.card .lb{position:absolute;top:4px;right:4px;font-size:10px;font-weight:900;background:#000a;padding:0 5px;border-radius:6px}
.slot{border:2px dashed #334155;border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:62px;color:#475569;font-size:22px}
.fnode{aspect-ratio:1;border-radius:12px;font-weight:900;border:2px solid #334155;background:#0f172a;color:#64748b}
.fnode.done{background:#14532d;border-color:#22c55e;color:#86efac}
.fnode.cur{background:#78350f;border-color:#facc15;color:#fde68a;animation:pulse 1.2s infinite}
.fnode.boss{border-color:#ef4444}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 14px #facc15aa}}
/* Combate */
#battle{background:radial-gradient(900px 500px at 50% 40%,#16204a 0,#060914 70%)}
.fcard{position:relative;width:var(--cw,168px);text-align:center;background:#0d1530cc;border:2px solid #334155;border-radius:16px;padding:8px 10px;transition:transform .1s}
.fcard[data-side=A]{border-color:#3b82f6;box-shadow:0 0 18px -4px #3b82f6}
.fcard[data-side=B]{border-color:#ef4444;box-shadow:0 0 18px -4px #ef4444}
.fcard.aura-gold{border-color:#facc15!important;box-shadow:0 0 30px 4px #facc15aa!important;animation:aura 1.6s infinite}
@keyframes aura{50%{box-shadow:0 0 46px 10px #facc15cc}}
.fcard[data-side=A].lunge{animation:lungeUp .35s}
.fcard[data-side=B].lunge{animation:lungeDown .35s}
@keyframes lungeUp{40%{transform:translateY(-40px) scale(1.08)}}
@keyframes lungeDown{40%{transform:translateY(40px) scale(1.08)}}
.fcard.hit{animation:hitf .3s}
@keyframes hitf{25%{transform:translateX(-8px);filter:brightness(2) saturate(2)}60%{transform:translateX(8px)}}
.strow{display:flex;gap:6px;justify-content:center;width:100%;padding:0 8px}
.sl{width:var(--cw,168px);flex:none;display:flex;justify-content:center}
.fcard .em{font-size:3rem;line-height:1}
#battle[data-k="2"] .em{font-size:2.6rem}
#battle[data-k="3"] .em{font-size:2.1rem}
#battle[data-k="4"] .em{font-size:1.6rem}
#battle[data-k="5"] .em{font-size:1.35rem}
#battle[data-k="3"] .fcard{padding:6px 5px}
#battle[data-k="4"] .fcard,#battle[data-k="5"] .fcard{padding:4px 2px;border-radius:10px}
#battle[data-k="3"] .nm{font-size:11px}
#battle[data-k="4"] .nm,#battle[data-k="5"] .nm{font-size:9px}
#battle[data-k="4"] .hpt,#battle[data-k="5"] .hpt{font-size:8px}
#battle[data-k="4"] .hpbar,#battle[data-k="5"] .hpbar{height:7px}
#battle[data-k="4"] .float,#battle[data-k="5"] .float{font-size:12px}
#battle[data-k="4"] .float.crit,#battle[data-k="5"] .float.crit{font-size:18px}
.bchip.sm{width:30px;font-size:15px;padding:1px 2px}
.hpbar{height:10px;background:#1e293b;border-radius:6px;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width .45s ease}
.hpbar.sm{height:5px;margin-top:2px}
.enbar{height:4px;background:#1e293b;border-radius:4px;overflow:hidden;margin-top:3px}
.enbar i{display:block;height:100%;background:#facc15;transition:width .3s}
.bchip{width:40px;text-align:center;font-size:20px;background:#0d1530;border:1px solid #1e293b;border-radius:10px;padding:2px 3px;transition:.2s}
.bchip.act{border-color:#facc15;transform:scale(1.1)}
.bchip.dead{filter:grayscale(1);opacity:.35}
.float{position:absolute;left:50%;top:25%;transform:translateX(-50%);font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 2px 4px #000;animation:floatUp 1s forwards;white-space:nowrap;z-index:5}
.float.dmg{color:#ef4444}.float.crit{color:#facc15;font-size:36px}.float.heal{color:#4ade80}.float.txt{color:#e2e8f0;font-size:14px}.float.sk{color:#67e8f9;font-size:15px}
@keyframes floatUp{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-70px}}
.sshake{animation:sshake .4s}
@keyframes sshake{20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(4px,5px)}}
.fall{animation:fall .5s forwards}
@keyframes fall{to{opacity:.25;transform:scale(.85) rotate(-6deg);filter:grayscale(1)}}
/* Sobres */
.packshake{display:inline-block;animation:pshake .6s infinite}

.flipin{animation:flipin .85s cubic-bezier(.2,.8,.2,1)}

.flashgo{animation:flashgo .8s}
@keyframes flashgo{0%{opacity:1}100%{opacity:0}}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid #facc15;color:#fde68a;padding:8px 16px;border-radius:12px;font-weight:800;font-size:13px;z-index:120;animation:toast 2.2s forwards}
@keyframes toast{0%{opacity:0;top:0}10%,85%{opacity:1;top:14px}100%{opacity:0}}
input{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px;color:#fff;width:100%;font-size:14px;user-select:text}
.hidden{display:none!important}

.tw-head{position:sticky;top:-12px;z-index:20;margin:-12px -12px 0;padding:10px 12px;background:linear-gradient(#0b1226f5,#0b1226cc);backdrop-filter:blur(6px);border-bottom:1px solid #1e293b}
.tmap{position:relative;border-radius:16px;overflow:hidden;margin-top:10px;border:1px solid #1e293b;box-shadow:inset 0 0 60px #000a}
.tz{position:absolute;left:0;right:0;pointer-events:none;overflow:hidden}
.tz-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px;opacity:.07;filter:blur(1px)}
.tz-rib{position:absolute;left:8px;right:8px;z-index:3;text-align:center;font-size:12px;font-weight:900;padding:7px 8px;border-radius:12px;color:#fff;background:linear-gradient(90deg,transparent,#000b 15%,#000b 85%,transparent);border-top:1px solid var(--g);border-bottom:1px solid var(--g);text-shadow:0 0 8px var(--g)}
.tz-rib span{color:var(--g);margin-right:2px}.tz-rib.lock{opacity:.6}
.tsvg{position:absolute;left:0;top:0;width:100%;z-index:1;pointer-events:none}
.tsvg path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round}
.tsvg .pl{stroke:#94a3b866;stroke-width:4;stroke-dasharray:2 10}
.tsvg .pd{stroke:#4ade80;stroke-width:5;filter:drop-shadow(0 0 4px #22c55e)}
.tnode{position:absolute;z-index:4;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;border:3px solid #475569;background:radial-gradient(circle at 35% 30%,#1e293b,#0b1020);color:#94a3b8;box-shadow:0 4px 10px #0009}
.tnode .ty{position:absolute;right:-6px;bottom:-5px;font-style:normal;font-size:13px;background:#0b1020;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:1px solid #334155}
.tnode.lock{opacity:.55;font-size:15px}
.tnode.done{background:radial-gradient(circle at 35% 30%,#16a34a,#14532d);border-color:#4ade80;color:#dcfce7;box-shadow:0 0 12px #22c55e88}
.tnode.cur{width:64px;height:64px;background:radial-gradient(circle at 35% 30%,#f59e0b,#78350f);border-color:#fde047;color:#fff;font-size:22px;animation:curpulse 1.2s ease-in-out infinite}
.tnode .you{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:900;color:#fde047;background:#000b;padding:1px 6px;border-radius:8px;white-space:nowrap;animation:youbob 1s ease-in-out infinite}
.tnode.boss{width:88px;height:88px;flex-direction:column;border-width:4px;border-radius:26px;transform:translate(-50%,-50%) rotate(0);background:radial-gradient(circle at 35% 25%,#7f1d1d,#2a0505);border-color:#ef4444;color:#fecaca;box-shadow:0 0 20px #ef4444aa,0 6px 14px #000a}
.tnode.boss.crown{background:radial-gradient(circle at 35% 25%,#a16207,#451a03);border-color:#facc15;color:#fef3c7;box-shadow:0 0 22px #facc15aa,0 6px 14px #000a}
.tnode.boss .bi{font-size:34px;line-height:1;filter:drop-shadow(0 0 6px currentColor)}
.tnode.boss .bt{font-size:10px;letter-spacing:.12em;margin-top:2px}
.tnode.boss.lock{opacity:.7;filter:saturate(.5)}
.tnode.boss.done{background:radial-gradient(circle at 35% 25%,#16a34a,#14532d);border-color:#4ade80;box-shadow:0 0 18px #22c55e99}
.tnode.boss.cur{width:96px;height:96px;font-size:18px;animation:bosspulse 1.1s ease-in-out infinite}
@keyframes curpulse{0%,100%{box-shadow:0 0 0 0 #facc15aa,0 0 14px #f59e0b}50%{box-shadow:0 0 0 14px #facc1500,0 0 28px #fbbf24}}
@keyframes bosspulse{0%,100%{box-shadow:0 0 0 0 #ef4444cc,0 0 20px #ef4444}50%{box-shadow:0 0 0 16px #ef444400,0 0 38px #facc15}}
@keyframes youbob{50%{transform:translate(-50%,-4px)}}
#zb{position:fixed;top:64px;left:50%;z-index:40;max-width:92vw;transform:translate(-50%,-30px);opacity:0;pointer-events:none;padding:9px 16px;border-radius:14px;font-size:13px;font-weight:900;color:#fff;background:#050810ee;border:1px solid var(--g);box-shadow:0 0 22px var(--g),0 8px 20px #000a;text-align:center;transition:.4s}
#zb span{color:var(--g)}#zb.show{opacity:1;transform:translate(-50%,0)}
</style>

<!-- ===== AUTH ===== -->
<div id="auth" class="hidden fixed inset-0 z-[90] overflow-y-auto" style="background:radial-gradient(900px 500px at 50% 0,#1b2447,#070b16)">

    <div class="panel">

      <div class="space-y-2">
        <input id="aUser" placeholder="Nombre de usuario" maxlength="16" autocomplete="username" autocapitalize="off">
        <input id="aPass" type="password" placeholder="Contraseña (mín. 6)">
      </div>
      <button class="btn w-full mt-3" id="aGo" onclick="authGo()">Entrar</button>

    </div>
    <div class="text-center text-xs text-slate-500 my-3">— o —</div>

      <input id="lUser" placeholder="Nombre de jugador (modo local)" maxlength="16">
      <button class="btn gray w-full mt-2" onclick="playLocal()">Jugar sin cuenta (solo en este dispositivo)</button>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <header class="flex items-center justify-between px-3 py-2 border-b border-slate-800" style="background:#0b1226e6">
    <div class="font-black text-sm tracking-wide"><span class="text-red-500">MCU</span> GACHA <span id="sync" class="text-[10px] text-slate-500 ml-1"></span></div>
    <div class="flex gap-3 text-sm font-black"><span id="hCoins">🪙 0</span><span id="hFrags">🧩 0</span></div>
  </header>
  <main id="view"></main>
  <nav>
    <button data-t="tower" onclick="go('tower')"><span>🏰</span>TORRE</button>
    <button data-t="tourn" onclick="go('tourn')"><span>🏆</span>TORNEOS</button>
    <button data-t="col" onclick="go('col')"><span>🦸</span>COLECCIÓN</button>
    <button data-t="shop" onclick="go('shop')"><span>🛒</span>TIENDA</button>
    <button data-t="set" onclick="go('set')"><span>⚙️</span>AJUSTES</button>
  </nav>
</div>

<!-- ===== MODAL ===== -->
<div id="modal" class="hidden fixed inset-0 z-[70] items-end sm:items-center justify-center" style="background:#000b" onclick="if(event.target===this)closeModal()">

</div>

<!-- ===== COMBATE ===== -->
<div id="battle" class="hidden fixed inset-0 z-[75] flex-col">

    <div id="bTitle" class="truncate">Combate</div>
    <div class="flex gap-2">
      <button class="chip" onclick="bSpeed()" id="bSpd">x1</button>
      <button class="chip" onclick="BSKIP=true">⏭ Saltar</button>
      <button class="chip" onclick="bFlee()">🏳 Huir</button>
    </div>
  </div>
  <div id="benchB" class="flex flex-wrap gap-1 justify-center p-1"></div>
  <div class="flex-1 flex flex-col items-center justify-around">

    <div id="stA" class="strow"></div>

  <div id="benchA" class="flex flex-wrap gap-1 justify-center p-1"></div>
  <div id="bLog" class="h-14 text-center text-[11px] text-slate-300 px-3 overflow-hidden leading-4 pb-2"></div>
</div>

<!-- ===== SOBRES ===== -->
<div id="packOv" class="hidden fixed inset-0 z-[85] items-center justify-center flex-col" style="background:#000e">

</div>

   stg.innerHTML=`<div class="flipin mx-auto" style="width:190px">${cardEl(r.n,{force:1,lvl:1,noLvl:1})}</div><div class="mt-3 font-black ${r.isNew?'text-emerald-400':'text-slate-300'}">${r.isNew?'✨ ¡NUEVO!':'Duplicado (+1 copia)'}</div>`;

function buildMap(){const ROW=82,BOSSX=46,RIB=64,PADB=40,PADT=60;let b=PADB;const pos=[],bands=[];
 for(let p=1;p<=10;p++){const[a,e]=phaseRange(p);const b0=b;b+=RIB;for(let g=a;g<e;g++){const boss=g===e-1;b+=ROW/2+(boss?BOSSX/2:0);pos[g]={b,boss,p,i:g-a};b+=ROW/2+(boss?BOSSX/2:0)}bands.push({p,b0,b1:b})}
 const H=b+PADT;pos.forEach(n=>{n.y=H-n.b;n.x=n.boss?50:50+31*Math.sin(((n.p-1)*10+n.i)*1.12)});
 bands.forEach(z=>{z.top=H-z.b1;z.bot=H-z.b0});return{pos,bands,H}}
function vTower(){const d=S.tower.done,cur=Math.min(d,TOWER_TOTAL-1);TMAP=TMAP||buildMap();const{pos,bands,H}=TMAP;
 let o=`<div class="tw-head"><div class="text-center"><div class="text-lg font-black leading-tight">🏰 Torre del Infinito</div><div class="text-[11px] text-slate-300">${d}/${TOWER_TOTAL} combates · Equipo ${S.team.length}/5</div></div>${S.box>0?`<button class="btn gold w-full mt-2" onclick="openBox()">📦 Abrir Caja de Fase (${S.box} sobres)</button>`:''}${d>=TOWER_TOTAL?'<div class="text-center text-amber-300 font-black text-sm mt-1">🏆 ¡Has completado las 10 fases!</div>':''}</div>`;
 const stops=bands.map((z,i)=>`${ZONE[i].c} ${((H-(z.top+z.bot)/2)/H*100).toFixed(1)}%`);
 const bg=`linear-gradient(to top,${ZONE[0].c} 0%,${stops.join(',')},${ZONE[9].c} 100%)`;
 o+=`<div id="tmap" class="tmap" style="height:${H}px;background:${bg}">`;
 bands.forEach((z,i)=>{const Z=ZONE[i],ph=PH[i],lock=d<phaseRange(z.p)[0];
  o+=`<div class="tz" style="top:${z.top}px;height:${z.bot-z.top}px;background:radial-gradient(70% 55% at 50% 50%,${Z.g}26,transparent 70%)"><div class="tz-wm">${Z.wm}</div></div>`;
  o+=`<div class="tz-rib ${lock?'lock':''}" style="top:${z.bot-52}px;--g:${Z.g}"><span>📍 ZONA ${z.p}</span> ${ph.title}</div>`});
 let seg='';for(let g=0;g<TOWER_TOTAL-1;g++){const A=pos[g],B=pos[g+1],my=(A.y+B.y)/2,dn=g+1<=d;seg+=`<path d="M${A.x.toFixed(1)} ${A.y.toFixed(0)} C${A.x.toFixed(1)} ${my.toFixed(0)},${B.x.toFixed(1)} ${my.toFixed(0)},${B.x.toFixed(1)} ${B.y.toFixed(0)}" class="${dn?'pd':'pl'}"/>`}
 o+=`<svg class="tsvg" viewBox="0 0 100 ${H}" preserveAspectRatio="none">${seg}</svg>`;
 for(let g=0;g<TOWER_TOTAL;g++){const n=pos[g],Z=ZONE[n.p-1],st=g<d?'done':g===d?'cur':'lock',ty=PAT[n.p][n.i];
  const inner=n.boss?`<span class="bi">${st==='done'?'✓':Z.ic}</span><span class="bt">${st==='lock'?'🔒':'JEFE'}</span>`:st==='done'?'✓':st==='lock'?'<span class="opacity-70">🔒</span>':`<span>${n.i+1}</span>`;
  o+=`<button id="tn${g}" class="tnode ${st} ${n.boss?'boss '+Z.bk:''}" style="left:${n.x.toFixed(2)}%;top:${n.y}px;--g:${Z.g}" ${st==='cur'?'onclick="towerPreview()"':''}>${inner}${!n.boss&&st!=='lock'?`<i class="ty">${TYI[ty]}</i>`:''}${st==='cur'?'<em class="you">▼ TÚ</em>':''}</button>`}
 return o+'</div>'}
function towerScroll(smooth){const v=$('#view'),n=$('#tn'+Math.min(S.tower.done,TOWER_TOTAL-1));if(!v||!n)return;const vr=v.getBoundingClientRect(),nr=n.getBoundingClientRect();v.scrollTo({top:Math.max(0,v.scrollTop+(nr.top-vr.top)-v.clientHeight*.5+nr.height/2),behavior:smooth?'smooth':'auto'})}

 const A=S.team.map(n=>mkF(n,S.col[n].lvl,S.col[n].ab));const w=await runBattle(A,buildEnemies(F),`Fase ${F.p} · Combate ${F.i+1}`,F.k);
 if(w==='A'){const rw=towerReward(F);S.tower.done++;S.coins+=rw.coins;S.frags+=rw.frags;if(rw.box)S.box+=rw.box;save();hdr();endBattle();confetti(F.boss?260:120);snd('win');
  result(true,`<div class="text-sm">🪙 +${rw.coins} · 🧩 +${rw.frags}</div>${rw.box?`<div class="mt-2 font-black text-amber-300">¡Fase ${F.p} completada! 📦 Caja de Fase (${rw.box} sobres)</div>`:''}`,rw.box?'📦 Abrir caja':'Continuar',rw.box?()=>openBox():null)}
 else{endBattle();snd('lose');result(false,'','Volver',null)}}
async function openBox(){if(S.box<=0)return;const n=S.box;S.box=0;save();await openPacks('tower',n,'Caja de Fase','📦');render()}
function result(win,html,btn,cb){NEXT=cb;modal(`<div class="text-center"><div class="text-5xl">${win?'🏆':'💀'}</div><div class="text-2xl font-black my-2 ${win?'text-amber-300':'text-red-400'}">${win?'¡VICTORIA!':'DERROTA'}</div>${html}<button class="btn w-full mt-4" onclick="resultNext()">${btn}</button></div>`)}
function resultNext(){closeModal();const f=NEXT;NEXT=null;if(f)f();else render();render()}

/* ===================== COMBATE UI ===================== */
function stageHTML(f,hp,max,en,thr,s){return`<div class="fcard ${f.aura==='gold'?'aura-gold':''}" data-uid="${f.uid}" data-side="${f.side}"><div class="em">${f.emoji}</div><div class="nm text-xs font-black truncate mt-1">${f.label}</div><div class="hpbar"><i data-hp="${f.uid}" style="width:${hp/max*100}%"></i></div><div class="hpt text-[10px]" data-hpt="${f.uid}">${hp}/${max}</div><div class="enbar"><i data-en="${f.uid}" style="width:${thr?Math.min(100,en/thr*100):0}%"></i></div><div class="text-[12px] h-4" data-stt="${f.uid}">${s||''}</div></div>`}
const benchHTML=t=>t.map(f=>`<div class="bchip${t.length>6?' sm':''}" data-b="${f.uid}" title="${f.label}">${f.emoji}<div class="hpbar sm"><i data-hp="${f.uid}" style="width:100%"></i></div></div>`).join('');
const stageEl=f=>document.querySelector(`#st${f.side} [data-uid="${f.uid}"]`);
function floatTxt(f,t,c){if(BSKIP)return;const el=stageEl(f);if(!el)return;const d=document.createElement('div');d.className='float '+c;d.textContent=t;el.appendChild(d);setTimeout(()=>d.remove(),1000)}
function setHP(f,hp,max){document.querySelectorAll(`[data-hp="${f.uid}"]`).forEach(e=>e.style.width=Math.max(0,hp/max*100)+'%');document.querySelectorAll(`[data-hpt="${f.uid}"]`).forEach(e=>e.textContent=hp+'/'+max);{const b=document.querySelector(`[data-b="${f.uid}"]`);if(b){b.classList.toggle('dead',hp<=0);if(hp<=0)b.classList.remove('act')}}}
function blog(t){const l=$('#bLog');l.innerHTML=(l.innerHTML+'<div>'+t+'</div>').split('</div>').slice(-4).join('</div>')}
const bsl=ms=>BSKIP?Promise.resolve():wait(ms/BSPEED);
function bSpeed(){BSPEED=BSPEED===1?2:BSPEED===2?4:1;$('#bSpd').textContent='x'+BSPEED}
function bFlee(){if(confirm('¿Huir del combate? Contará como derrota.'))BABORT=true}
async function handle(e){switch(e.k){
 case'enter':{const sl=document.querySelector(`#st${e.side} [data-slot="${e.slot||0}"]`);if(sl)sl.innerHTML=stageHTML(e.f,e.hp,e.max,e.en,e.thr,e.s);const ch=document.querySelector(`#bench${e.side} [data-b="${e.f.uid}"]`);if(ch)ch.classList.add('act');await bsl(e.slot?160:260);break}
 case'lunge':{const el=stageEl(e.f);if(el&&!BSKIP){el.classList.remove('lunge');void el.offsetWidth;el.classList.add('lunge')}await bsl(260);break}
 case'skill':{floatTxt(e.f,'✨ '+e.txt,'sk');blog(`<b>${e.f.label}</b>: ${e.txt}`);await bsl(380);break}
 case'dmg':{setHP(e.f,e.hp,e.max);floatTxt(e.f,(e.crit?'💥 ':'')+'-'+e.amt,e.crit?'crit':'dmg');const el=stageEl(e.f);
  if(el&&!BSKIP){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}
  if(!BSKIP&&e.f.side==='A'&&(e.crit||e.amt>=e.max*.22)){const b=$('#battle');b.classList.remove('sshake');void b.offsetWidth;b.classList.add('sshake')}
  snd(e.crit?'crit':'hit');await bsl(e.dot?160:260);break}
 case'heal':{setHP(e.f,e.hp,e.max);floatTxt(e.f,'+'+e.amt,'heal');if(e.txt)blog(`<b>${e.f.label}</b>: ${e.txt}`);snd('heal');await bsl(240);break}
 case'txt':{floatTxt(e.f,e.txt,'txt');await bsl(300);break}
 case'hpset':{setHP(e.f,e.hp,e.max);break}
 case'down':{const el=stageEl(e.f);if(el)el.classList.add('fall');blog(`💀 ${e.f.label} cae`);await bsl(350);break}
 case'st':{const s=document.querySelector(`#st${e.f.side} [data-stt="${e.f.uid}"]`);if(s)s.textContent=e.s;const n=document.querySelector(`#st${e.f.side} [data-en="${e.f.uid}"]`);if(n)n.style.width=(e.thr?Math.min(100,e.en/e.thr*100):0)+'%';break}}}
async function play(evs){for(const e of evs)await handle(e)}
const slotsHTML=k=>Array.from({length:k},(_,i)=>`<div class="sl" data-slot="${i}"></div>`).join('');
async function runBattle(a,b,title,k){k=k||1;BSKIP=false;BABORT=false;const B=new Battle(a,b,k);const ov=$('#battle');ov.classList.remove('hidden');ov.classList.add('flex');
 ov.dataset.k=k;ov.style.setProperty('--cw',Math.max(58,Math.min(168,Math.floor((Math.min(innerWidth,900)-24-(k-1)*6)/k)))+'px');
 $('#bTitle').textContent=title;$('#bLog').innerHTML='';$('#benchA').innerHTML=benchHTML(a);$('#benchB').innerHTML=benchHTML(b);$('#stA').innerHTML=slotsHTML(k);$('#stB').innerHTML=slotsHTML(k);$('#bSpd').textContent='x'+BSPEED;
 await play(B.ev);B.ev=[];
 while(!B.over&&!BABORT){B.step();await play(B.ev);B.ev=[];await bsl(120)}
 if(BABORT)B.winner='B';return B.winner}
function endBattle(){const ov=$('#battle');ov.classList.add('hidden');ov.classList.remove('flex')}

/* ===================== TORNEOS UI ===================== */
function vTourn(){const t=S.tourn;
 if(!t)return`<div class="text-center mb-3"><div class="text-xl font-black">🏆 Torneos Draft</div><div class="text-xs text-slate-400">Elige 5 luchadores, roba rivales y sube de nivel</div></div><div class="space-y-2">${Object.entries(TDIF).map(([k,d])=>`<div class="panel flex items-center gap-3"><div class="text-4xl">${d.ic}</div><div class="flex-1"><div class="font-black">${d.title||d.label} · desde ${RN[d.n]}</div><div class="text-[11px] text-slate-400">${d.n} combates (desde ${RN[d.n]}) · Premio final: ${d.prize}</div></div><button class="btn gold !py-2" ${S.coins<d.cost?'disabled':''} onclick="tStart('${k}')">${d.cost?'🪙 '+d.cost:'GRATIS'}</button></div>`).join('')}</div><div class="text-[11px] text-slate-500 mt-3">Usa luchadores del roster completo (no necesitas tenerlos). El progreso se guarda y puedes reanudarlo.</div>`;
 const d=TDIF[t.diff],rn=RN[d.n-t.r];const row=(tm,fn)=>`<div class="grid grid-cols-5 gap-1.5">${tm.map((x,i)=>`<div ${fn?`onclick="${fn}(${i})"`:''}>${cardEl(x.n,{mini:1,lvl:x.lvl})}</div>`).join('')}</div>`;
 const head=`<div class="flex justify-between items-center mb-3"><div><div class="font-black">${d.ic} ${d.title||'Torneo '+d.label}</div><div class="text-[11px] text-slate-400">${t.stage==='champ'||t.stage==='out'?'Finalizado':rn+' · '+(t.r+1)+'/'+d.n}</div></div><button class="chip" onclick="tQuit()">Abandonar</button></div>`;
 if(t.stage==='draft')return head+`<div class="panel mb-3"><div class="text-xs font-black mb-2">Tu plantilla (${t.team.length}/5)</div>${t.team.length?row(t.team):'<div class="slot">+</div>'}</div><div class="text-sm font-black mb-2 text-center">Elige tu héroe ${t.team.length+1}/5</div><div class="grid grid-cols-3 gap-2">${t.opts.map(n=>`<div onclick="tPick('${n}')">${cardEl(n,{force:1,lvl:1,noLvl:1})}</div>`).join('')}</div>`;
 if(t.stage==='ready')return head+`<div class="panel mb-3"><div class="text-xs font-black mb-1">Tu equipo · orden de combate 1 → 5</div><div class="text-[10px] text-slate-400 mb-2">Toca un héroe y luego otro para intercambiar sus posiciones.</div><div class="grid grid-cols-5 gap-1.5">${t.team.map((x,i)=>`<div class="relative rounded-2xl ${t.ord===i?'ring-2 ring-amber-400':''}" onclick="tReorder(${i})"><div class="absolute -top-1 -left-1 z-10 text-[10px] font-black bg-amber-400 text-black rounded-full w-4 h-4 flex items-center justify-center">${i+1}</div>${cardEl(x.n,{mini:1,lvl:x.lvl})}</div>`).join('')}</div></div><div class="panel mb-3"><div class="text-xs font-black mb-2 text-red-400">Rival</div>${row(t.enemy)}</div><button class="btn red w-full" onclick="tFight()">⚔️ ¡Luchar ${rn}!</button>`;
 if(t.stage==='steal')return head+(t.sel==null?`<div class="text-center font-black mb-1">🎯 ¡Victoria! Roba un luchador rival</div><div class="text-[11px] text-slate-400 text-center mb-2">Conserva su nivel actual</div><div class="grid grid-cols-5 gap-1.5 mb-3">${t.enemy.map((x,i)=>`<div onclick="tSel(${i})" class="${t.team.some(y=>y.n===x.n)?'opacity-30':''}">${cardEl(x.n,{mini:1,lvl:x.lvl})}</div>`).join('')}</div><button class="btn gray w-full" onclick="tSkipSteal()">Saltar</button>`:`<div class="text-center font-black mb-2">¿A quién sustituye ${CH[t.enemy[t.sel].n].emoji} ${t.enemy[t.sel].n}?</div>${row(t.team,'tSwap')}<button class="btn gray w-full mt-3" onclick="tSel(null)">Atrás</button>`);
 if(t.stage==='lvl')return head+`<div class="text-center font-black mb-2">⬆️ Sube +1 nivel a un héroe</div>${row(t.team,'tLvl')}`;
 if(t.stage==='champ')return head+`<div class="panel text-center"><div class="text-5xl">🏆</div><div class="text-xl font-black text-amber-300 my-2">¡CAMPEÓN!</div><div class="text-sm">Premio: ${d.prize}</div><button class="btn w-full mt-3" onclick="tQuit(1)">Cerrar torneo</button></div>`;
 return head+`<div class="panel text-center"><div class="text-5xl">💀</div><div class="text-xl font-black text-red-400 my-2">Eliminado en ${RN[d.n-t.r]}</div><button class="btn w-full mt-3" onclick="tQuit(1)">Cerrar torneo</button></div>`}
function tOpts(){const t=S.tourn,taken=t.team.map(x=>x.n);t.opts=shuffle(NAMES.filter(n=>!taken.includes(n))).slice(0,3)}
function tStart(k){const d=TDIF[k];if(S.coins<d.cost)return toast('Monedas insuficientes');S.coins-=d.cost;S.tourn={diff:k,r:0,stage:'draft',team:[],opts:[],enemy:null,sel:null};tOpts();save();hdr();render()}
function tPick(n){const t=S.tourn;t.team.push({n,lvl:1});if(t.team.length>=5){t.stage='ready';t.enemy=enemyTeam(t.diff,0)}else tOpts();save();render()}
function tQuit(done){if(!done&&!confirm(S.tourn&&S.tourn.diff==='free'?'¿Abandonar el desafío? No recibirás ninguna recompensa.':'¿Abandonar el torneo? Perderás la inscripción.'))return;S.tourn=null;save();render()}
async function tFight(){const t=S.tourn,d=TDIF[t.diff];t.ord=null;const A=t.team.map(x=>mkF(x.n,x.lvl,abOf(x.lvl))),E=t.enemy.map(x=>mkF(x.n,x.lvl,abOf(x.lvl)));
 const w=await runBattle(A,E,`${RN[d.n-t.r]} (${t.r+1}/${d.n})`);endBattle();
 if(w==='A'){S.twins++;confetti(120);snd('win');
  if(t.r>=d.n-1){t.stage='champ';save();confetti(300);render();
   if(t.diff==='free'){S.coins+=200;save();hdr();toast('🪙 +200 monedas');await new Promise(r=>setTimeout(r,900))}
   else if(t.diff==='hard')await openPacks('special',3+Math.floor(Math.random()*3),'Cofre de Torneo Especial','🧰');
   else await openPacks('basic',t.diff==='easy'?2:4,'Premio del torneo','🏆');render()}
  else{t.stage='steal';t.sel=null;save();toast('¡Victoria!');render()}}
 else{t.stage='out';save();snd('lose');toast('Derrota');render()}}
function tReorder(i){const t=S.tourn;if(t.ord==null)t.ord=i;else if(t.ord===i)t.ord=null;else{[t.team[t.ord],t.team[i]]=[t.team[i],t.team[t.ord]];t.ord=null}save();render()}
function tSel(i){const t=S.tourn;if(i!=null&&t.team.some(y=>y.n===t.enemy[i].n))return toast('Ya tienes a ese luchador');t.sel=i;render()}
function tSwap(i){const t=S.tourn,x=t.enemy[t.sel];t.team[i]={n:x.n,lvl:x.lvl};t.stage='lvl';t.sel=null;save();render()}
function tSkipSteal(){S.tourn.stage='lvl';save();render()}
function tLvl(i){const t=S.tourn;if(t.team[i].lvl>=10)return toast('Ya está al máximo');t.team[i].lvl++;t.r++;t.stage='ready';t.enemy=enemyTeam(t.diff,t.r);save();render()}

/* ===================== AJUSTES / RANKING ===================== */
function vSet(){return`<div class="text-center mb-3"><div class="text-xl font-black">⚙️ Ajustes & Ranking</div></div>
 <div class="panel mb-3"><div class="font-black text-sm mb-2">🌍 Ranking global</div><div id="rank" class="text-sm text-slate-400">Cargando…</div></div>
 <div class="panel mb-3 space-y-2"><div class="font-black text-sm">👤 Sesión</div><div class="text-xs text-slate-300">${S.name} · ${USER?'Cuenta en la nube':'Modo local (sin nube)'}</div><div class="text-xs text-slate-400">Puntuación: <b class="text-amber-300">${score()}</b></div>
  ${USER?`<button class="btn gray w-full !py-2" onclick="cloudSave().then(()=>toast('Guardado en la nube'))">☁️ Guardar ahora</button>`:''}<button class="btn red w-full !py-2" onclick="logout()">Cerrar sesión</button></div>
 <div class="panel mb-3"><div class="font-black text-sm mb-2">🔊 Sonido</div><button class="btn ${S.sound?'':'gray'} w-full !py-2" onclick="S.sound=!S.sound;save();render()">${S.sound?'Sonido activado':'Sonido desactivado'}</button></div>
 <div class="panel"><div class="font-black text-sm mb-2">🗑️ Datos</div><button class="btn red w-full !py-2 font-black" onclick="deleteAccount(event)">🗑️ Eliminar partida</button><div class="text-[10px] text-slate-500 mt-3">Proyecto de fans sin ánimo de lucro, no afiliado a Marvel ni Disney.</div></div>`}
async function loadRanking(){const el=$('#rank');if(!el)return;if(!sb){el.innerHTML=`<div>Ranking solo disponible con cuenta en la nube.</div><div class="mt-1 text-amber-300 font-bold">Tu puntuación local: ${score()}</div>`;return}
 const{data,error}=await sb.from('ranking').select('username,score,tower_done').order('score',{ascending:false}).limit(50);if(!$('#rank'))return;
 if(error||!data)return el.textContent='No se pudo cargar el ranking (¿ejecutaste el SQL de configuración?).';
 el.innerHTML=data.length?data.map((r,i)=>`<div class="flex items-center gap-2 py-1 border-b border-slate-800 ${r.username===S.name?'text-amber-300 font-black':''}"><span class="w-6">${['🥇','🥈','🥉'][i]||i+1}</span><span class="flex-1 truncate">${r.username||'?'}</span><span class="text-[11px] text-slate-400">🏰${r.tower_done}</span><span class="font-black">${r.score}</span></div>`).join(''):'Aún no hay jugadores.'}
let DELETING=false;
async function deleteAccount(e){
  if(e) { e.preventDefault(); e.stopPropagation(); }
  if(DELETING) return; DELETING=true;

  // Diálogo de confirmación de seguridad
  const confirmacion = confirm("⚠️ ¿ESTÁS SEGURO?\n\nEsta acción eliminará tu partida y todo tu progreso de forma permanente. ¿Quieres continuar?");
  if (!confirmacion) { DELETING=false; return; }

  // Evitar que un guardado pendiente vuelva a escribir datos
  clearTimeout(saveT);

  // 1. Limpiar almacenamiento local (tanto modo local como datos en caché)
  localStorage.removeItem(KEY('local'));
  localStorage.removeItem('mcu_mode');
  if (typeof USER !== 'undefined' && USER) {
    localStorage.removeItem(KEY(USER.id));
    // 2. Si hay cuenta en la nube, borrar la fila en Supabase
    if (typeof sb !== 'undefined' && sb) {
      try {
        const { error } = await sb.from('players').delete().eq('id', USER.id);
        if (error) console.error("Error borrando en Supabase:", error);
        await sb.auth.signOut();
      } catch(err) { console.error("Error borrando en Supabase:", err); }
    }
  }
  S = null; // bloquea cualquier guardado posterior

  // 3. Recargar la aplicación para volver al menú de Inicio / Modo Local limpio
  location.reload();
}

boot();
</script>
